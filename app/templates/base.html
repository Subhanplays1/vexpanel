<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}VexPanel{% endblock %}</title><style>:root{--bg:#080b14;--panel:#101625;--line:#252d43;--text:#f5f7ff;--muted:#99a5bd;--primary:#7c5cff;--cyan:#44d5ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2b1f5977,transparent 32rem),var(--bg);color:var(--text);font:14px system-ui}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#090d18dd;position:sticky;top:0}.brand{font-weight:850;font-size:20px}.brand b{color:var(--cyan)}.links{display:flex;gap:7px;align-items:center}.links a{text-decoration:none;color:var(--muted);padding:9px 11px;border-radius:8px}.links a:hover{background:#182038;color:white}.wrap{max-width:1200px;margin:auto;padding:38px 24px}.card{background:linear-gradient(145deg,#12192b,#0e1321);border:1px solid var(--line);border-radius:15px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--primary);color:white;text-decoration:none;font-weight:750;cursor:pointer;display:inline-block}.btn.secondary{background:#182034;border:1px solid var(--line)}.muted{color:var(--muted)}input,select{width:100%;background:#090e19;border:1px solid #2d3650;border-radius:8px;padding:12px;color:white;margin-top:6px}label{font-weight:650;font-size:13px}.alert{margin-bottom:18px;padding:12px 14px;border:1px solid #84464e;background:#2b171d;border-radius:9px}.grid{display:grid;gap:16px}@media(max-width:650px){.nav{padding:0 16px}.links a:not(.btn){display:none}.wrap{padding:25px 16px}}</style>{% block head %}{% endblock %}</head><body><nav class="nav"><a class="brand" href="/dashboard" style="text-decoration:none;color:white"><b>✦</b> VexPanel</a><div class="links">{% if current_user.is_authenticated %}<a href="/dashboard">Dashboard</a><a href="/create_vps">Deploy</a>{% if is_admin %}<a href="/admin">Admin</a>{% endif %}<a href="/profile">{{ current_user.username }}</a><a class="btn secondary" href="/logout">Sign out</a>{% else %}<a href="/login">Log in</a><a class="btn" href="/register">Get started</a>{% endif %}</div></nav><main class="wrap">{% if error %}<div class="alert">{{ error }}</div>{% endif %}{% block content %}{% endblock %}</main></body></html>
