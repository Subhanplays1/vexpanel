{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block head %}<style>.auth-shell{min-height:calc(100vh - 245px);display:grid;place-items:center}.auth-card{max-width:460px;width:100%;background:linear-gradient(155deg,rgba(21,35,57,.96),rgba(8,15,28,.98))}.auth-brand{width:112px;height:74px;overflow:hidden;position:relative;margin:auto;filter:drop-shadow(0 0 18px rgba(34,211,238,.3))}.auth-brand img{width:250px;max-width:none;position:absolute;transform:translate(-76px,-30px);mix-blend-mode:screen}.auth-card h1{letter-spacing:-.04em;font-weight:750}.auth-card .card-body{padding:2.4rem}.form-label{font-size:.86rem;font-weight:650}.auth-note{font-size:.8rem;color:var(--ac-muted)}</style>{% endblock %}
{% block content %}<div class="auth-shell"><section class="card auth-card"><div class="card-body"><div class="text-center mb-4"><div class="auth-brand mb-3"><img src="{{ url_for('static', filename='brand/aethercloud-logo.png') }}" alt="VexPanel"></div><h1 class="h3 mb-2">Welcome back</h1><p class="text-muted mb-0">Sign in to your {{ panel_name }} workspace.</p></div><form method="post"><div class="mb-3"><label class="form-label" for="username">Username</label><div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus></div></div><div class="mb-4"><label class="form-label" for="password">Password</label><div class="input-group"><span class="input-group-text"><i class="bi bi-key"></i></span><input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required></div></div><button type="submit" class="btn btn-primary w-100">Sign in <i class="bi bi-arrow-right ms-1"></i></button></form><div class="d-flex align-items-center gap-3 my-4"><hr class="flex-grow-1"><span class="auth-note">NEW TO AETHERCLOUD?</span><hr class="flex-grow-1"></div><a href="/register" class="btn btn-outline-primary w-100">Create your account</a></div></section></div>{% endblock %}
