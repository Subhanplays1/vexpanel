<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VexPanel</title><style>:root{color-scheme:dark;--bg:#080a12;--card:#111628;--line:#2a324a;--purple:#8b5cf6;--muted:#9fa8be}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#392268,transparent 35%),var(--bg);color:#fff;font:15px system-ui}nav,main{max-width:1120px;margin:auto;padding:0 24px}nav{height:76px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:21px}.brand span{color:#22d3ee}button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;color:#fff;background:transparent;cursor:pointer}.primary{background:linear-gradient(135deg,#9465ff,#6540e8)}.hero{text-align:center;padding:98px 0 62px}.eyebrow{color:#c8b6ff;border:1px solid #4d3b82;border-radius:99px;padding:7px 12px;font-size:12px}.hero h1{font-size:clamp(46px,8vw,78px);letter-spacing:-4px;line-height:1;margin:26px 0}.hero h1 b{color:#a98cff}.hero p{max-width:590px;margin:auto;color:var(--muted);font-size:18px;line-height:1.7}.actions{margin-top:30px;display:flex;gap:12px;justify-content:center}.preview{margin:auto;max-width:930px;background:#0d1120;border:1px solid var(--line);border-radius:16px;padding:16px}.dots{color:#ff7169;letter-spacing:5px;border-bottom:1px solid var(--line);padding-bottom:12px}.mock{padding:28px;color:var(--muted);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{border:1px solid var(--line);padding:18px;border-radius:10px}.tile b{display:block;font-size:27px;color:#fff;margin-top:8px}.modal{display:none;position:fixed;inset:0;background:#05060bd9;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(410px,100%);background:var(--card);border:1px solid var(--line);padding:28px;border-radius:15px}.dialog h2{margin:0}.dialog p,#message{color:var(--muted)}input{display:block;width:100%;margin:10px 0;padding:13px;background:#090d19;border:1px solid #36405c;border-radius:8px;color:#fff}.dialog .primary{width:100%;margin-top:8px}.close{float:right;color:var(--muted)}@media(max-width:600px){.mock{grid-template-columns:1fr}.hero{padding-top:65px}}</style></head><body><nav><div class="brand"><span>✦</span> VexPanel</div><div><button id="loginOpen">Log in</button><button class="primary" id="registerOpen">Get started</button></div></nav><main><section class="hero"><span class="eyebrow">MODERN INFRASTRUCTURE CONTROL</span><h1>Your servers,<br><b>under control.</b></h1><p>Deploy, monitor, and manage VPS infrastructure with a premium browser-based control panel.</p><div class="actions"><button class="primary" id="startOpen">Create account →</button><button id="secondLogin">Sign in</button></div></section><section class="preview"><div class="dots">● ● ●</div><div class="mock"><div class="tile">TOTAL VPS<b>12</b></div><div class="tile">RUNNING<b>10</b></div><div class="tile">RDP ONLINE<b>6</b></div></div></section></main><div id="modal" class="modal"><form id="form" class="dialog"><button type="button" id="close" class="close">×</button><h2 id="heading">Welcome back</h2><p id="copy">Sign in to manage your infrastructure.</p><input id="email" type="email" placeholder="Email address" required><input id="password" type="password" minlength="12" placeholder="Password (12+ characters)" required><button id="submit" class="primary">Sign in</button><p id="message"></p></form></div><script>const modal=document.getElementById('modal'),form=document.getElementById('form'),heading=document.getElementById('heading'),copy=document.getElementById('copy'),submit=document.getElementById('submit'),message=document.getElementById('message'),email=document.getElementById('email'),password=document.getElementById('password');let mode='login';function open(next){mode=next;heading.textContent=next==='login'?'Welcome back':'Create your account';copy.textContent=next==='login'?'Sign in to manage your infrastructure.':'Start with a secure VexPanel account.';submit.textContent=next==='login'?'Sign in':'Create account';message.textContent='';modal.classList.add('open')}document.getElementById('loginOpen').onclick=()=>open('login');document.getElementById('secondLogin').onclick=()=>open('login');document.getElementById('registerOpen').onclick=()=>open('register');document.getElementById('startOpen').onclick=()=>open('register');document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};form.onsubmit=async e=>{e.preventDefault();message.textContent='Please wait…';try{let r=await fetch('/api/v1/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(d.success)window.location.href='/dashboard';else message.textContent=d.error.message}catch{x=1;message.textContent='Unable to reach the server.'}}</script></body></html>
